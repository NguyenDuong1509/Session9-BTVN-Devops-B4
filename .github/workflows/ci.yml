name: Employee Service CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "Stage 1: Test with PostgreSQL"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: hr_db
          POSTGRES_USER: hr_user
          POSTGRES_PASSWORD: hr_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests with PostgreSQL Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hr_db
          SPRING_DATASOURCE_USERNAME: hr_user
          SPRING_DATASOURCE_PASSWORD: hr_password
          SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
        run: ./gradlew test

  build:
    name: "Stage 2: Package JAR Artifact"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Build Application JAR (skip tests)
        run: ./gradlew build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: employee-service-artifact
          path: build/libs/*.jar
          retention-days: 1

  dockerize:
    name: "Stage 3: Dockerize & Verify"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: employee-service-artifact
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Build (Local Check)
        run: |
          echo "Building Docker image locally from artifact..."
          docker build -t employee-service:1.0.0 .
          echo "Docker image built successfully!"
